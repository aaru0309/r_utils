<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スケジュール作成ツール</title>
    <link rel="stylesheet" href="./css/style.css">
<style id="common-tool-nav-style">
/* 全ツール共通：メイン画面へ戻るナビゲーション */
.common-tool-nav{position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 16px;box-sizing:border-box;background:#172b4d;color:#fff;box-shadow:0 3px 12px rgba(15,23,42,.16);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;}
.common-tool-nav__label{font-size:12px;font-weight:700;letter-spacing:.03em;opacity:.88;white-space:nowrap;}
.common-tool-nav__actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.common-tool-nav__button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 15px;border:1px solid rgba(255,255,255,.45);border-radius:10px;background:#fff;color:#1d4ed8;text-decoration:none;font-size:13px;font-weight:800;line-height:1.2;white-space:nowrap;box-sizing:border-box;transition:background .15s ease,transform .15s ease;}
.common-tool-nav__button:hover{background:#eaf1ff;transform:translateY(-1px);}
.common-tool-nav__button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px;}
@media(max-width:520px){.common-tool-nav{min-height:50px;padding:7px 8px;gap:6px}.common-tool-nav__label{display:none}.common-tool-nav__actions{width:100%;justify-content:flex-start;gap:6px}.common-tool-nav__button{min-height:36px;padding:7px 9px;font-size:11px}}
</style>
<style id="tool-header-spacing-fix">
  /* 共通ナビとツール本体を見やすく分離 */
  .unified-home-nav{
    margin-bottom:16px;
  }

  /* ツール本体上部の操作UIが詰まらないようにする */
  .tool-header,
  .toolbar,
  .topbar,
  .header,
  header{
    box-sizing:border-box;
  }

  @media (max-width: 1100px){
    .tool-header,
    .toolbar,
    .topbar,
    .header,
    header{
      flex-wrap:wrap !important;
      row-gap:10px !important;
    }

    .tool-header > *,
    .toolbar > *,
    .topbar > *,
    .header > *,
    header > *{
      min-width:0;
    }
  }

  @media (max-width: 760px){
    .unified-home-nav{
      margin-bottom:14px;
    }

    .tool-header,
    .toolbar,
    .topbar,
    .header,
    header{
      gap:8px !important;
      align-items:flex-start !important;
    }

    button,
    select,
    input[type="button"],
    input[type="submit"]{
      min-height:38px;
    }
  }
</style>
</head>
<body>
<nav class="common-tool-nav" aria-label="ツールナビゲーション">
  <span class="common-tool-nav__label">HTML便利ツール</span>
  <div class="common-tool-nav__actions">
    <a class="common-tool-nav__button" href="../index.html" aria-label="メイン画面へ戻る">← メイン画面</a>
  </div>
</nav>


    <div class="header">
        <h2>スケジュール作成ツール</h2>
        <div class="controls">
            <label>
                日程: 
                <select id="durationSelect" onchange="handleDurationSelect()">
                    <option value="1">日帰り</option>
                    <option value="2" selected>1泊2日</option>
                    <option value="3">2泊3日</option>
                    <option value="other">その他</option>
                </select>
            </label>
            
            <span id="customDuration">
                <select id="customNights" onchange="updateCustomDaysOptions()"></select> 泊
                <select id="customDays" onchange="updateDuration()"></select> 日
            </span>

            <button onclick="addCandidate()">＋ 候補を追加</button>
            <button class="btn-import" onclick="openImportModal()">📥 読込</button>
            
            <div class="export-group">
                <select id="exportAction">
                    <option value="download">💾 保存</option>
                    <option value="copy">📋 コピー</option>
                </select>
                <button class="btn-save" onclick="executeExport()">実行</button>
            </div>
        </div>
    </div>

    <div class="candidates-container" id="candidatesContainer"></div>

    <div class="modal-overlay" id="importModal">
        <div class="modal-content">
            <h3 style="margin: 0;">テキストから復元</h3>
            <p style="margin: 0; font-size: 13px; color: #666;">コピーしたテキストデータを貼り付けてください。現在の入力内容は上書きされます。</p>
            <textarea id="importText" placeholder="【プラン名 N泊M日】..."></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeImportModal()">キャンセル</button>
                <button class="btn-import" onclick="executeImport()">復元する</button>
            </div>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
